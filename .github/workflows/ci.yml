name: CI

# Ajoute le 2026-10-30 en reponse a "es ce que c possible dans github de
# declencher le test" -- jusqu'ici, "les tests passent" n'etait verifie que
# localement, par moi ou par Olivier, ce qui ne prouve rien a un tiers (ou a
# une IA externe) qui n'a aucune raison de nous croire sur parole. Ce
# workflow fait tourner cargo build + cargo test --lib + une poignee de
# scenarios live (examples/*_smoke_test.rs, examples/full_architecture_ai_
# to_ai_test.rs) sur l'infrastructure de GitHub elle-meme, a chaque push et
# chaque pull request -- un signal verifiable par n'importe qui via l'onglet
# Actions, independant de ce que dit ce depot ou son auteur.
#
# LIMITE HONNETE: ceci ne rend PAS le serveur CSTL public ni interrogeable
# en continu par un tiers -- chaque run demarre un serveur ephemere, le
# teste, et le detruit. C'est une preuve que le code marche a cet instant,
# pas un endpoint permanent. La question de l'hebergement public reste
# ouverte, separement.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build + tests (unitaires et live)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Installe la toolchain Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache des dependances cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --lib
        run: cargo build --lib --verbose

      - name: cargo build --bin cstl_parser
        run: cargo build --bin cstl_parser --verbose

      # --all-targets (2026-11-17) : sans ca, un exemple/bench/test d'integration
      # qui ne compile plus passait inapercu (examples/parser_coverage_n100.rs
      # est reste casse plusieurs jours, cassant `cargo build --all-targets`).
      - name: cargo build --all-targets
        run: cargo build --all-targets

      - name: cargo test (unitaires + integration tests/)
        run: cargo test --verbose

      # Scenarios live: demarrent un vrai CstlNativeServer sur un port
      # ephemere et verifient son comportement reel de bout en bout, pas
      # juste des assertions en memoire isolees. Memes exemples que ceux
      # documentes dans AGENTS.md -- si l'un de ceux-ci echoue ici, les
      # instructions donnees aux IA dans AGENTS.md mentent.
      - name: Smoke test -- architecture complete AI-to-AI
        run: cargo run --example full_architecture_ai_to_ai_test

      - name: Smoke test -- audit deontique (intra-payload + cross-history informatif)
        run: cargo run --example deontic_audit_smoke_test

      - name: Smoke test -- rejet dur opt-in cross-history (strict_deontic_history)
        run: cargo run --example strict_deontic_history_smoke_test

      - name: Smoke test -- UNCERTAINTY_AUDIT + /audit/query reel
        run: cargo run --example uncertainty_and_audit_query_smoke_test

      - name: Smoke test -- contexte de conversation (CONVERSATION_CONTEXT)
        run: cargo run --example conversation_context_smoke_test

      - name: Smoke test -- protection Sybil du quorum
        run: cargo run --example quorum_sybil_test

      - name: Smoke test -- persistance de l'identite d'agent a travers un restart
        run: cargo run --example agent_registry_persistence_test

      # Ajoutes le 2026-11-17 : ces 6 scenarios live echouaient tous sans
      # qu'aucune CI ne le signale (ils n'etaient lances par personne). Deux
      # d'entre eux revelaient de vrais bugs du pipeline (breaker pondere par
      # sigma, ADN_DELTA annonce sur un replay).
      - name: Smoke test -- quorum BFT multi-connexions
        run: cargo run --example quorum_smoke_test

      - name: Smoke test -- gouvernance (circuit breaker + council signe)
        run: cargo run --example governance_smoke_test

      - name: Smoke test -- persistance de la gouvernance a travers un restart
        run: cargo run --example governance_persistence_smoke_test

      - name: Smoke test -- ADN_DELTA (pas de delta sur un replay)
        run: cargo run --example adn_delta_smoke_test

      - name: Smoke test -- Double Livre / calibration sigma
        run: cargo run --example double_livre_smoke_test

      - name: Smoke test -- entites orphelines (W608)
        run: cargo run --example orphaned_entity_smoke_test

      - name: Couverture parser N=100 (catalogue officiel)
        run: cargo run --example parser_coverage_n100

      # Banc d'essai CSTL vs JSON Schema + Ed25519 (2026-11-17) : echoue si CSTL
      # rate une des 12 erreurs attendues ou rejette un des 5 messages valides.
      - name: Installe Python (banc d'essai comparatif)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Banc d'essai CSTL vs JSON Schema + Ed25519
        run: |
          pip install cryptography jsonschema pytest
          python3 scripts/benchmark_cstl_vs_jsonschema.py

      # Agent LLM -> vrai serveur (stub de modele) : enregistrement, relations
      # verifiables, signalements lus, contradiction visible dans Obsidian et
      # Graphify. Avant le 2026-11-17 l'agent n'avait jamais ete execute contre
      # le serveur (enregistrement rejete, messages en parse_error).
      - name: Agent LLM contre le vrai serveur
        run: python3 -m pytest -q sdk/python/test_llm_agent_live.py sdk/python/test_strict_mode_live.py sdk/python/test_action_authorization_live.py sdk/python/test_mandatory_authorization_live.py sdk/python/test_witness_rollback_live.py sdk/python/test_secure_defaults_live.py sdk/python/test_json_gateway_live.py sdk/python/test_mcp_proxy_live.py sdk/python/test_demo_live.py sdk/python/test_conformance.py sdk/python/test_a2a_proxy_live.py sdk/python/test_gate_live.py sdk/python/test_control_benchmark.py sdk/python/test_policy_receipt_live.py

      # Paquet Python (2026-11-25) : la roue se construit, s'installe dans un
      # environnement vierge, et la demonstration passe 7/7 depuis le paquet.
      - name: Paquet Python installe + cstl-demo
        run: |
          python3 -m venv /tmp/cstl_pkg
          /tmp/cstl_pkg/bin/pip install ./sdk/python
          cd /tmp && CSTL_BINARY=$GITHUB_WORKSPACE/target/debug/cstl_parser /tmp/cstl_pkg/bin/cstl-demo

      # SDK TypeScript (2026-11-25) : vecteurs de conformite, puis tests en
      # direct contre le serveur compile plus haut.
      - name: Installe Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: SDK TypeScript (npm test)
        working-directory: sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npm test

      # Etaient #[ignore] avec un chemin absolu d'une autre machine : jamais
      # executes. Prouvent que Python signe ce que Rust verifie, et inversement.
      - name: Validation croisee des signatures Rust <-> Python
        run: cargo test --test cross_validation_signing_test -- --include-ignored

  # Ajoute le 2026-11-17 : le SDK Python n'etait teste par aucune CI. Resultat
  # constate a ce moment-la : requirements.txt ne s'installait plus (pydantic
  # 2.6.0 sans wheel Python 3.13), 2 dependances importees n'etaient pas
  # declarees, 4 tests echouaient (chemin absolu d'une autre machine, API
  # Hermes desynchronisee) et GET /audit/stats repondait 404 depuis toujours.
  python-sdk:
    name: SDK Python (pytest + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Installe Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installe les dependances (runtime + test)
        run: pip install -r requirements-dev.txt pip-audit

      - name: pytest (les DeprecationWarning du SDK sont des erreurs)
        run: python -m pytest -q -W error::DeprecationWarning:cstl_adn_server -W error::DeprecationWarning:cstl_obsidian_bridge -W error::DeprecationWarning:cstl_graphify_bridge

      - name: pip-audit (vulnerabilites connues des dependances)
        run: pip-audit -r requirements.txt
