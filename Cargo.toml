[package]
name = "cstl_parser"
version = "5.0.0"
edition = "2021"
description = "CSTL v5.0.0 — Rust TCP-native agentic server (parser, validator, audit chain, KB verification)"
authors = ["Olivier Goyette"]

[lib]
name = "cstl_parser"
path = "src/lib.rs"

# Pas de section [[bin]] explicite: Cargo detecte automatiquement src/main.rs
# comme binaire par defaut (nomme d'apres le package, "cstl_parser") -- c'est
# ce que `cargo run` lance depuis le debut de cette session. Un bloc [[bin]]
# commente nommant "cstl_validate" trainait ici et ne correspondait a rien
# de reel; retire le 2026-09-03 pour ne pas induire en erreur.

[dependencies]
# Session #5 (v4.9.3): "zero deps, hand-rolled lexer+parser" etait vrai a
# l'epoque. Plus maintenant -- ce commentaire mentait depuis l'ajout de
# tokio (couche TCP), sha2/rusqlite (audit + adn_store), reqwest (kb_verify
# / Wikidata), serde (wire format des reponses) et unicode-normalization
# (NFC). Corrige le 2026-09-03.

[dev-dependencies]
# Requis pour les tests de src/signing.rs et src/crypto/post_quantum.rs
# (SigningKey::generate(&mut csprng)) -- ed25519-dalek 2.x exige un
# CryptoRngCore, rand 0.8's OsRng l'implemente.
# Aussi utilisé en production dans post_quantum.rs pour la génération de clés.
criterion = "0.5"
proptest = "1.4"

[dev-dependencies.wiremock]
# Serveur HTTP mock local pour tests/kb_verify_mock_wikidata_test.rs -- exerce
# reellement l'orchestration reseau de KbVerifier::detect_entanglement (appels
# HTTP, parsing JSON) contre un serveur qui reproduit le format de reponse
# SPARQL de Wikidata, sans dependre du vrai wikidata.org (bloque sur ce
# sandbox). dev-dependency seulement: aucun code de production n'en depend.
version = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# La ligne `tokio = { version = "1", features = ["full"] }` vivait ici par
# erreur -- une section [profile.*] ne prend pas de dependances, donc cargo
# l'ignorait silencieusement en emettant "unused manifest key:
# profile.release.tokio" a CHAQUE build de cette session (visible dans
# chaque cargo build/test depuis le debut). Retiree le 2026-09-03; le vrai
# tokio est deja declare juste en dessous, avec la contrainte de version
# reellement utilisee (1.40, pas 1).

[dependencies.tokio]
version = "1.40"
features = ["full"]

[dependencies.sha2]
version = "0.10"

[dependencies.rusqlite]
version = "0.31"
features = ["bundled"]

[dependencies.reqwest]
version = "0.12"
features = ["json"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.unicode-normalization]
version = "0.1"

[dependencies.ed25519-dalek]
# Premiere dependance crypto de ce projet en dehors du hachage (sha2) --
# signature de messages par agent (Couche 2/securite, 2026-09-04), ferme
# OWASP ASI03/ASI07 (identite/integrite inter-agents non authentifiees).
# Feature "rand_core" necessaire pour SigningKey::generate(&mut csprng)
# utilise dans les tests de src/signing.rs -- pas activee par defaut.
version = "2"
features = ["rand_core"]

[dependencies.hex]
# Le hex hand-roule via `{:x}` (server/audit.rs) marche seulement sur le
# GenericArray retourne par sha2 -- pas sur les octets bruts [u8;N] des
# cles/signatures Ed25519. Petite dependance dediee plutot que refaire un
# encodeur hex a la main.
version = "0.4"

[dependencies.chrono]
# DateTime timestamps for audit trails, member health tracking, case lifecycle
version = "0.4"
features = ["serde"]

[dependencies.uuid]
# Case ID generation (arbitrage system)
version = "1"
features = ["v4", "serde"]

[dependencies.log]
# Structured logging for error handling, replacing eprintln! throughout
version = "0.4"

# v5.1 Dependencies (Cryptography, Compression, TLS, Metrics)
[dependencies.rustls]
# TLS 1.3 mutual authentication layer
version = "0.23"

[dependencies.rustls-pemfile]
# PEM certificate/key parsing for rustls
version = "2"

[dependencies.tokio-rustls]
# Async TLS for tokio runtime
version = "0.26"

[dependencies.aes-gcm]
# AES-256-GCM authenticated encryption
version = "0.10"

[dependencies.chacha20poly1305]
# ChaCha20-Poly1305 alternative cipher
version = "0.10"

[dependencies.zeroize]
# Secure memory wiping for crypto keys
version = "1.7"

[dependencies.pqcrypto-kyber]
# Post-quantum NIST-standardized Kyber
version = "0.7"

[dependencies.pqcrypto-traits]
# Traits for post-quantum crypto
version = "0.3"

[dependencies.parking_lot]
# Faster parking_lot::Mutex for sharded registry
version = "0.12"

[dependencies.dashmap]
# Concurrent hashmap for sharded registry
version = "6"

[dependencies.prometheus]
# Prometheus metrics client
version = "0.13"

[dependencies.governor]
# Rate limiting
version = "0.7"

[dependencies.notify]
# File watch for live config reload
version = "6"

[dependencies.rand]
# Random number generation for key generation (both tests and production)
# Needed by ed25519-dalek for SigningKey::generate
version = "0.8"

[dependencies.protobuf]
# Direct dependency to override transitive prometheus -> protobuf v2.28.0
# Fixes CVE-2025-53605 (stack overflow via uncontrolled recursion)
version = "3.7.2"

[dependencies.axum]
# Web framework for REST API (Layer 5c: FastAPI integration)
version = "0.7"

[dependencies.tower]
# Middleware framework for axum
version = "0.4"

[dependencies.tower-http]
# Tower HTTP utilities (CORS, tracing)
version = "0.5"

[dev-dependencies.env_logger]
# Logger implementation for tests and development
version = "0.11"
