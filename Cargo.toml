[package]
name = "cstl_parser"
version = "5.0.0"
edition = "2021"
description = "CSTL v4.9.2 — Rust parser (lexer + recursive descent)"
authors = ["Olivier Goyette"]


# [[bin]]
# name = "cstl_validate"
# path = "src/main.rs"

[lib]
name = "cstl_parser"
path = "src/lib.rs"

[dependencies]
# Zero external deps — pure Rust lexer + parser
# nom would be option 1b — here we do hand-rolled for zero-dep portability

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
tokio = { version = "1", features = ["full"] }

[dependencies.tokio]
version = "1.40"
features = ["full"]

[dependencies.sha2]
version = "0.10"

[dependencies.rusqlite]
version = "0.31"
features = ["bundled"]
