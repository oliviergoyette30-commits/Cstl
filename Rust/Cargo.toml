[package]
name = "cstl_parser"
version = "4.9.3"
edition = "2021"
description = "CSTL v4.9.3 — Rust parser (lexer + recursive descent)"
authors = ["Olivier Goyette"]

[[bin]]
name = "cstl_validate"
path = "Src/main.rs"

[lib]
name = "cstl_parser"
path = "Src/lib.rs"

[dependencies]
# Zero external deps — pure Rust lexer + parser
# nom would be option 1b — here we do hand-rolled for zero-dep portability

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
